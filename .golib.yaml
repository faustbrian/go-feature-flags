schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
operations:
- module: .
  gate: docs
  steps:
  - type: go-test
    packages: [./...]
    run: '^Example'
    count: 1
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: [.]
    fuzz: '^FuzzImportNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzBucketIsStableAndBounded$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzDefinitionValidationNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzContextEvaluationNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzFleetInvalidationHistoryIsDeterministicAndBounded$'
    budget: 10000x
    timeout: 20m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: [.]
    benchmark: Benchmark
    budget: 100ms
    timeout: 20m
