schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^TestFleet(ConcurrentEvaluationActivationAndInvalidation|ShutdownJoinsBootstrapCacheWorkAndPreventsLateStart)$'
    race: true
    count: 1
    timeout: 2m
- module: .
  gate: docs
  steps:
  - type: go-test
    packages: [./...]
    run: '^Example'
    count: 1
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: [.]
    fuzz: '^FuzzImportNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzBucketIsStableAndBounded$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzDefinitionValidationNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzContextEvaluationNeverPanics$'
    budget: 10000x
    timeout: 20m
  - type: go-test
    packages: [.]
    fuzz: '^FuzzFleetInvalidationHistoryIsDeterministicAndBounded$'
    budget: 10000x
    timeout: 20m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: [.]
    benchmark: Benchmark
    budget: 100ms
    timeout: 20m
